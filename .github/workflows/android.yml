name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build optimized release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # A runner's default Android debug key is regenerated on a fresh runner.
      # Use a persistent development keystore from repository Actions secrets
      # for push/manual runs and same-repository PRs.
      - name: Configure persistent development signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TOV_SIGNING_KEYSTORE_BASE64: ${{ secrets.TOV_SIGNING_KEYSTORE_BASE64 }}
          TOV_SIGNING_KEY_ALIAS: ${{ secrets.TOV_SIGNING_KEY_ALIAS }}
          TOV_SIGNING_STORE_PASSWORD: ${{ secrets.TOV_SIGNING_STORE_PASSWORD }}
          TOV_SIGNING_KEY_PASSWORD: ${{ secrets.TOV_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TOV_SIGNING_KEYSTORE_BASE64" ] || [ -z "$TOV_SIGNING_KEY_ALIAS" ] || [ -z "$TOV_SIGNING_STORE_PASSWORD" ] || [ -z "$TOV_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets. Add TOV_SIGNING_KEYSTORE_BASE64, TOV_SIGNING_KEY_ALIAS, TOV_SIGNING_STORE_PASSWORD and TOV_SIGNING_KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/tov-development.keystore"
          echo "$TOV_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "TOV_SIGNING_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "TOV_SIGNING_KEY_ALIAS=$TOV_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TOV_SIGNING_STORE_PASSWORD=$TOV_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TOV_SIGNING_KEY_PASSWORD=$TOV_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build optimized release APK
        run: gradle --no-daemon assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tov-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
