# TEMPORARY diagnostic tooling (16/11/2026): builds a DEBUG APK so the
# sub-agent hang can be diagnosed with a working coroutine dump. The
# release build's R8 minification likely breaks DebugProbes.dumpCoroutines
# (the Coroutine dump button silently wrote nothing on the release build),
# while a debug build has no minification, so the dump should work there.
# DELETE this file once the hang is fixed — the release workflow in
# android.yml stays.
#
# The push trigger exists only to REGISTER this workflow on this branch:
# GitHub only lets workflow_dispatch run for workflows it has seen on the
# default branch, so a dispatch-only file living only on a feature branch
# answers 404. A push that touches this file registers it (and runs the
# debug build once); from then on it is dispatchable on this branch too.
# It is scoped to this branch and to this file, so no other push runs it.
name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/group-chat-ui
    paths:
      - .github/workflows/debug-apk.yml

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tov-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
